[package]
name = "mediafiles-ferry"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Hält Avid-MXF-Mediendateien mehrerer Schnittplätze ohne Verbindung synchron"

[dependencies]
blake3 = "1.8.7"
gethostname = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"

[[bin]]
name = "ferry"
path = "src/main.rs"
