[package]
name = "mediafiles-ferry"
version = "1.0.0-beta.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Keeps the Avid MXF media of several unconnected edit systems in sync"

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
gethostname = "1.1.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"
unicode-normalization = "0.1.26"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[[bin]]
name = "ferry"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18.1"

[[bin]]
name = "ferry-app"
path = "src/app.rs"
